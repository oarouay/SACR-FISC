[project]
name = "digital-commerce-intelligence"
version = "0.1.0"
description = "Digital Commerce Intelligence Platform MVP - Collection, Evidence & Extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "playwright>=1.47.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "aiosqlite>=0.20.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.8",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
